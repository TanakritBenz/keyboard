name: CI

on:
  push:
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Lua
      run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4

    - name: Validate Karabiner JSON
      run: python3 -m json.tool karabiner/karabiner.json > /dev/null

    - name: Check Lua syntax
      run: luac5.4 -p hammerspoon/*.lua

    - name: Validate SVGs and README file links
      run: python3 script/check
